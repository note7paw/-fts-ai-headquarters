
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTS 2.4 - AI Test</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  padding: 20px;
  max-width: 650px;
  margin: auto;
}
.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
}
select, textarea, button {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 8px 0 16px;
  border-radius: 7px;
  font-size: 16px;
}
textarea { min-height: 120px; }
button {
  background: #16a34a;
  color: white;
  border: 0;
  font-weight: bold;
}
#result {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #0f172a;
  padding: 14px;
  border-radius: 8px;
  min-height: 60px;
}
</style>
</head>
<body>
<h2>FOREX TRADING STUDIO</h2>
<p>FTS 2.4 — AI Employee Intelligence</p>

<div class="card">
  <label>Pilih karyawan AI</label>
  <select id="employee">
    <option>Maya</option>
    <option>Dimas</option>
    <option>Nadia</option>
    <option>Arif</option>
    <option>Sinta</option>
    <option>Bima</option>
    <option>Luna</option>
    <option>Tara</option>
    <option>Fajar</option>
    <option>Raka</option>
  </select>

  <label>Instruksi CEO</label>
  <textarea id="task">Buat laporan singkat tentang rencana pengembangan Forex Trading Studio. Sertakan 3 prioritas utama, rencana kerja, dan rekomendasi kepada CEO.</textarea>

  <button id="send" onclick="sendTask()">KIRIM TUGAS KE AI</button>

  <h3>Hasil pekerjaan AI</h3>
  <div id="result">Menunggu instruksi CEO...</div>
</div>

<script>
async function sendTask() {
  const button = document.getElementById("send");
  const result = document.getElementById("result");
  const employee = document.getElementById("employee").value;
  const task = document.getElementById("task").value.trim();

  if (!task) {
    result.textContent = "Silakan isi instruksi terlebih dahulu.";
    return;
  }

  button.disabled = true;
  button.textContent = "AI SEDANG BEKERJA...";
  result.textContent = "Menghubungi FTS AI Backend...";

  try {
    const response = await fetch(
      "https://fts-ai-backend.ardamjoker22.workers.dev/task",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ employee, task })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(data.error || "HTTP " + response.status);
    }

    result.textContent =
      "KARYAWAN: " + data.employee +
      "\nJABATAN: " + data.role +
      "\n\nHASIL PEKERJAAN:\n\n" + data.result;

  } catch (error) {
    result.textContent = "PENGUJIAN GAGAL:\n" + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "KIRIM TUGAS KE AI";
  }
}
</script>
</body>
</html>
