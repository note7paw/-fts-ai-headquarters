window.videoSections=[];
function splitVideoDocument(raw){
 const lines=String(raw||'').replace(/\\r/g,'').split('\\n');
 const sections=[];let current=null;
 const isHeading=line=>{
  const s=line.trim();
  if(!s)return false;
  return /^(?:#{1,3}\\s+|(?:BAB|BAGIAN|TAHAP|SECTION|SCENE)\\s*\\d+\\b|\\d{1,2}[.)]\\s+|\\*\\*[^*]{3,100}\\*\\*\\s*$)/i.test(s);
 };
 for(const line of lines){
  if(isHeading(line)){
   if(current&&current.text.trim())sections.push(current);
   let title=line.trim().replace(/^#{1,3}\\s*/,'').replace(/^\\*\\*(.*?)\\*\\*$/,'$1');
   current={title:title.slice(0,100),text:line};
  }else{
   if(!current)current={title:'RINGKASAN DAN ISI DOKUMEN',text:''};
   current.text+=(current.text?'\\n':'')+line;
  }
 }
 if(current&&current.text.trim())sections.push(current);
 if(!sections.length)sections.push({title:'DOKUMEN PRODUKSI',text:String(raw||'')});
 return sections;
}

window.runPresetTask=promptText=>{const input=document.getElementById('aiTaskInput');if(!input)return;input.value=promptText;window.runAiTask();};window.runAiTask=async()=>{const select=document.getElementById('aiEmployee'),input=document.getElementById('aiTaskInput'),button=document.getElementById('aiSendBtn'),result=document.getElementById('aiResult');if(!select||!input||!button||!result)return;const personIndex=Number(select.value),task=input.value.trim();if(!task){alert('Tuliskan instruksi CEO terlebih dahulu.');return}button.disabled=true;button.textContent='AI SEDANG BEKERJA...';result.textContent='Menghubungi FTS AI Backend...';try{const response=await fetch('https://fts-ai-backend.ardamjoker22.workers.dev/task',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({employee:people[personIndex].name,task})});let data;try{data=await response.json()}catch(e){throw new Error('Respons backend bukan JSON yang valid.')}if(!response.ok||!data.ok)throw new Error(data.error||('HTTP '+response.status));const report=String(data.result||'').trim();if(!report)throw new Error('Backend tidak mengirimkan hasil pekerjaan.');const t={id:Date.now()+Math.random(),person:personIndex,description:task,status:'REVIEW',result:report,created:new Date().toLocaleString('id-ID'),createdBy:'CEO Anang · AI Backend',history:[]};tasks.push(t);logTask(t,'Hasil AI diterima dan menunggu review CEO');persist();result.innerHTML='<b>HASIL AI BERHASIL DITERIMA</b><br><b>'+esc(data.employee||people[personIndex].name)+' — '+esc(data.role||people[personIndex].role)+'</b><br><br>'+esc(report)+'<br><br><span class="pill">TERSIMPAN · MENUNGGU REVIEW CEO</span>'; }catch(error){result.textContent='GAGAL MENGHUBUNGI AI:\\n'+error.message+'\\nPeriksa koneksi internet atau status backend.';}finally{button.disabled=false;button.textContent='KIRIM INSTRUKSI KE AI';}};
window.runMayaAiTask=async()=>{const select=document.getElementById('mayaAssignee'),input=document.getElementById('mayaTask'),result=document.getElementById('mayaAiResult');if(!select||!input||!result)return;const personIndex=Number(select.value),task=input.value.trim();if(!task){alert('Maya perlu menuliskan instruksi pekerjaan.');return}const p=people[personIndex];const button=document.getElementById('mayaAiBtn');if(!button){result.textContent='Tombol AI tidak ditemukan. Muat ulang halaman.';return}button.disabled=true;button.textContent='MAYA SEDANG MENGKOORDINASIKAN...';result.textContent='Maya mengirim pekerjaan kepada '+p.name+' ('+p.role+') melalui FTS AI...';try{const response=await fetch('https://fts-ai-backend.ardamjoker22.workers.dev/task',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({employee:p.name,task:'Anda bekerja sebagai '+p.role+' di Forex Trading Studio. Tanggung jawab: '+p.job+'\\n\\nInstruksi delegasi dari Maya, Managing Director: '+task+'\\n\\nKerjakan sesuai peran Anda. Berikan hasil konkret, langkah kerja, dan rekomendasi singkat untuk ditinjau CEO.'})});let data;try{data=await response.json()}catch(e){throw new Error('Respons backend bukan JSON valid.')}if(!response.ok||!data.ok)throw new Error(data.error||('HTTP '+response.status));const report=String(data.result||'').trim();if(!report)throw new Error('AI tidak mengirimkan hasil pekerjaan.');const t={id:Date.now()+Math.random(),person:personIndex,description:task,status:'REVIEW',result:report,created:new Date().toLocaleString('id-ID'),createdBy:'Maya · AI Workflow',history:[]};tasks.push(t);logTask(t,'Maya mendelegasikan pekerjaan dan AI mengirim hasil untuk review CEO');persist();result.innerHTML='<b>DELEGASI AI BERHASIL</b><br><b>'+esc(p.name)+' — '+esc(p.role)+'</b><br><br>'+esc(report)+'<br><br><span class="pill">TERSIMPAN · MENUNGGU REVIEW CEO</span>';}catch(error){result.textContent='DELEGASI GAGAL:\\n'+error.message+'\\nPeriksa koneksi internet atau status backend.';}finally{button.disabled=false;button.textContent='MAYA DELEGASI + JALANKAN DENGAN AI';}};function renderTasks(){if(!tasks.length)return '<p>Belum ada tugas. CEO dapat memberikan instruksi pertama.</p>';return tasks.slice().reverse().map((t)=>{const i=tasks.indexOf(t);return `<div class="task"><b>${esc(people[t.person]?.name||'Anggota tim')}</b> <span class="muted">· Oleh ${esc(t.createdBy||'CEO Anang')}</span><br><span class="pill">${esc(t.status)}</span><div class="actions">${t.status==='PENDING'?`<button onclick="setStatus(${i},'IN PROGRESS')">MULAI TUGAS</button>`:''}${t.status==='IN PROGRESS'?`<button onclick="submitReview(${i})">KIRIM UNTUK REVIEW</button>`:''}${t.status==='REVIEW'?`<button class="good" onclick="window.approveTask(${i})">APPROVE / DONE</button><button class="danger" onclick="window.returnTask(${i})">MINTA REVISI</button>`:''}${t.status!=='DONE'&&t.status!=='CANCELLED'?`<button onclick="editTask(${i})">UBAH TUGAS</button>`:''}${['PENDING','IN PROGRESS'].includes(t.status)?`<button class="danger" onclick="window.cancelTask(${i})">CANCEL TUGAS</button>`:''}<button onclick="historyTask(${i})">RIWAYAT</button></div><p>${esc(t.description)}</p><span class="muted">Dibuat: ${esc(t.created||'-')}</span>${t.result?`<p><b>Hasil/laporan:</b><br>${esc(t.result)}</p>`:''}${t.revisionNote?`<p><b>Catatan revisi CEO:</b><br>${esc(t.revisionNote)}</p>`:''}</div>`}).join('')}function addTask(i,value,by){const t={id:Date.now()+Math.random(),person:i,description:value,status:'PENDING',result:'',created:new Date().toLocaleString('id-ID'),createdBy:by,history:[]};tasks.push(t);logTask(t,'Tugas dibuat');persist()}
window.saveCommand=()=>{const selected=document.getElementById('assignee').value;if(selected===''){alert('Pilih anggota tim terlebih dahulu.');return}saveTask(Number(selected),'CEO Anang')};window.saveTask=(i,by='CEO Anang')=>{const input=document.getElementById('taskInput'),value=input.value.trim();if(!value){alert('Tuliskan instruksi terlebih dahulu.');return}addTask(i,value,by);openCommand()};window.setStatus=(i,status)=>{tasks[i].status=status;logTask(tasks[i],'Status diubah menjadi '+status);persist();openCommand()};window.submitReview=i=>{showPanel(`<h3>KIRIM HASIL UNTUK REVIEW</h3><p>Tugas: ${esc(tasks[i].description)}</p><label>Catatan atau hasil pekerjaan</label><textarea id="resultInput" placeholder="Tuliskan hasil pekerjaan atau laporan untuk CEO..."></textarea><button onclick="saveReview(${i})">KIRIM KE CEO</button>`)};window.saveReview=i=>{const v=document.getElementById('resultInput').value.trim();if(!v){alert('Isi laporan singkat sebelum mengirim review.');return}tasks[i].result=v;tasks[i].status='REVIEW';logTask(tasks[i],'Hasil dikirim untuk review');persist();openCommand()};window.approveTask=i=>{const t=tasks[i];showPanel(`<h3>KONFIRMASI CEO</h3><p>Apakah CEO menyetujui hasil pekerjaan berikut?</p><div class="task"><b>${esc(people[t.person]?.name||'Anggota tim')}</b><br>${esc(t.description)}<br><span class="pill">${esc(t.status)}</span></div><p>Jika disetujui, status tugas akan berubah menjadi DONE.</p><button class="good" onclick="window.confirmApprove( ${i} )">YA, SETUJUI HASIL</button><button onclick="openCommand()">BATAL</button>`)};window.confirmApprove=i=>{const t=tasks[i];t.status='DONE';t.approvedAt=new Date().toLocaleString('id-ID');t.approvedBy='CEO Anang';logTask(t,'Disetujui CEO Anang · '+t.approvedAt);persist();openCommand()};window.returnTask=i=>{const t=tasks[i];showPanel(`<h3>MINTA REVISI</h3><p><b>Anggota:</b> ${esc(people[t.person]?.name||'Anggota tim')}</p><p><b>Tugas:</b> ${esc(t.description)}</p><label>Catatan / alasan revisi dari CEO</label><textarea id="revisionInput" placeholder="Jelaskan bagian yang perlu diperbaiki..."></textarea><button class="danger" onclick="window.saveRevision(${i})">KIRIM CATATAN REVISI</button><button onclick="openCommand()">BATAL</button>`)};window.saveRevision=i=>{const v=document.getElementById('revisionInput').value.trim();if(!v){alert('Tuliskan catatan revisi terlebih dahulu.');return}const t=tasks[i];t.revisionNote=v;t.status='IN PROGRESS';logTask(t,'CEO meminta revisi: '+v);persist();openCommand()};window.editTask=i=>{showPanel(`<h3>UBAH TUGAS</h3><label>Instruksi pekerjaan</label><textarea id="editInput">${esc(tasks[i].description)}</textarea><button onclick="saveEdit(${i})">SIMPAN PERUBAHAN</button>`)};window.saveEdit=i=>{const v=document.getElementById('editInput').value.trim();if(!v){alert('Instruksi tidak boleh kosong.');return}tasks[i].description=v;logTask(tasks[i],'Instruksi diperbarui');persist();openCommand()};window.cancelTask=i=>{const t=tasks[i];if(!t||!['PENDING','IN PROGRESS'].includes(t.status)){alert('Hanya tugas PENDING atau IN PROGRESS yang dapat dibatalkan.');return}showPanel(`<h3>KONFIRMASI PEMBATALAN CEO</h3><p>Anda akan membatalkan tugas milik <b>${esc(people[t.person]?.name||'Anggota tim')}</b>.</p><div class="task"><b>${esc(t.description)}</b><br><span class="pill">${esc(t.status)}</span></div><label>Alasan pembatalan (wajib)</label><textarea id="cancelReason" placeholder="Tuliskan alasan pembatalan..."></textarea><button class="danger" onclick="window.confirmCancelTask(${i})">YA, BATALKAN TUGAS</button><button onclick="openCommand()">KEMBALI</button>`)};window.confirmCancelTask=i=>{const reason=document.getElementById('cancelReason').value.trim();if(!reason){alert('Tuliskan alasan pembatalan terlebih dahulu.');return}const t=tasks[i];if(!t||!['PENDING','IN PROGRESS'].includes(t.status)){alert('Status tugas sudah berubah.');openCommand();return}t.status='CANCELLED';t.cancelledAt=new Date().toLocaleString('id-ID');t.cancelledBy='CEO Anang';t.cancelReason=reason;logTask(t,'Dibatalkan oleh CEO Anang. Alasan: '+reason);persist();openCommand()};window.historyTask=i=>{const t=tasks[i];showPanel(`<h3>RIWAYAT TUGAS</h3><p><b>${esc(t.description)}</b></p>${(t.history||[]).map(h=>`<div class="task"><span class="pill">${esc(h.status)}</span><br>${esc(h.note)}<br><span class="muted">${esc(h.at)}</span></div>`).join('')||'<p>Belum ada riwayat.</p>'}`)};
window.home=()=>{camera.position.set(13,12,18);controls.target.set(0,1,0);controls.update()};window.move=(x,z)=>{camera.position.set(x+8,9,z+12);controls.target.set(x*.35,1,z*.35);controls.update()};const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',event=>{if(document.getElementById('panel').style.display==='block')return;const r=renderer.domElement.getBoundingClientRect();pointer.x=((event.clientX-r.left)/r.width)*2-1;pointer.y=-((event.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(clickable);if(hits.length)window.openProfile(hits[0].object.userData.personIndex)});function animate(){requestAnimationFrame(animate);const t=performance.now()*.001;animated.forEach((a)=>{
 const active=tasks.some(task=>task.person===a.index&&task.status==='IN PROGRESS');
 const review=tasks.some(task=>task.person===a.index&&task.status==='REVIEW');
 const busy=active||review,phase=(t+a.phase)%20,roam=!busy&&phase<4;
 const targetX=a.baseX,targetZ=busy?a.deskZ:a.baseZ+(roam?Math.cos((phase/4)*Math.PI*2)*.32:0);
 const dx=targetX-a.root.position.x,dz=targetZ-a.root.position.z;
 const moving=Math.hypot(dx,dz)>.07;
 a.root.position.x+=dx*.045;a.root.position.z+=dz*.045;
 if(moving){
  a.root.rotation.y=Math.atan2(dx,dz);
  const gait=Math.sin(t*8+a.phase);
  a.leftLeg.rotation.x=gait*.42;a.rightLeg.rotation.x=-gait*.42;
  a.leftArm.rotation.x=-gait*.28;a.rightArm.rotation.x=gait*.28;
  a.root.position.y=Math.abs(Math.sin(t*8+a.phase))*.045;
 }else if(busy){
  a.root.rotation.y=0;
  a.leftLeg.rotation.x=-1.28;a.rightLeg.rotation.x=-1.28;
  a.leftArm.rotation.x=-.82+Math.sin(t*8+a.phase)*.13;
  a.rightArm.rotation.x=-.82+Math.sin(t*8+a.phase+1)*.13;
  a.head.rotation.x=.13+Math.sin(t*2+a.phase)*.035;
  a.torso.rotation.x=-.07;
  a.root.position.y=-.22;
 }else{
  a.root.rotation.y=Math.sin(t*.7+a.phase)*.08;
  a.leftLeg.rotation.x=0;a.rightLeg.rotation.x=0;
  a.leftArm.rotation.x=Math.sin(t*1.1+a.phase)*.045;
  a.rightArm.rotation.x=-Math.sin(t*1.1+a.phase)*.045;
  a.head.rotation.x=Math.sin(t*1.4+a.phase)*.035;
  a.head.rotation.y=Math.sin(t*.7+a.phase)*.13;
  a.torso.rotation.x=0;
  a.root.position.y=Math.sin(t*1.4+a.phase)*.018;
 }
});controls.update();renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
