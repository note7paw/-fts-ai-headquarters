:#9fe8ff;font-size:10px;margin:4px 0}.muted{color:#b9d8e8;font-size:11px}.actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.danger{border-color:#ff8b8b;background:#512b37}.good{border-color:#66dfa9;background:#14513f}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.tabs button{font-size:11px;padding:8px}.tabs button.active{background:#087ca5;border-color:#8be7ff}.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.stat{background:#0b1c2d;border:1px solid #285777;border-radius:9px;padding:10px}.stat b{display:block;color:#64dcff;font-size:20px}.stat span{font-size:10px;color:#b9d8e8}.notice{background:#392f16;border:1px solid #a98a3c;border-radius:9px;padding:10px;color:#ffe6a3;font-size:12px;line-height:1.45}hr{border:0;border-top:1px solid #285777;margin:13px 0}@media(max-width:500px){#top h2{font-size:13px}#top small{font-size:9px}#info{font-size:9px;padding:8px}#controls button{padding:8px 9px;font-size:10px}#ceoFloat{bottom:108px;right:9px;font-size:11px}#hint{bottom:70px}.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

<div id="top"><h2>FTS AI HEADQUARTERS</h2><small>Forex Trading Studio • Version 2.3</small></div><div id="info">CEO OFFICE<br>10 TEAM MEMBERS<br><span id="taskCount">0 TASKS</span></div><div id="hint">Ketuk avatar anggota tim untuk membuka profil</div>
<div id="controls"><button onclick="home()">HOME</button><button onclick="move(-7,0)">LEFT</button><button onclick="move(7,0)">RIGHT</button><button onclick="move(0,7)">FRONT</button><button onclick="move(0,-7)">BACK</button></div><button id="ceoFloat" onclick="openCommand()">CEO COMMAND</button><div id="panel"><button id="close" onclick="closePanel()">TUTUP ✕</button><div id="panelContent"></div></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07111f);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1000);camera.position.set(13,12,18);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1,0);controls.maxPolarAngle=Math.PI/2.05;controls.minDistance=7;controls.maxDistance=35;scene.add(new THREE.HemisphereLight(0x9edcff,0x18243b,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(8,15,10);scene.add(light);
function box(w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.55}));m.position.set(x,y,z);scene.add(m);return m}box(18,.4,14,0x172b40,0,-.2,0);box(12,.08,9,0x203d55,0,.05,0);box(18,5,.3,0x102c45,0,2.5,-7);box(.3,5,14,0x102c45,-9,2.5,0);box(.3,5,14,0x102c45,9,2.5,0);box(18,4,.12,0x17617b,0,2.5,7);box(3,.25,1.4,0x38a9cf,0,1,-4);box(.15,1,.15,0x9bbacb,-1.3,.5,-4);box(.15,1,.15,0x9bbacb,1.3,.5,-4);box(1,.9,.8,0x1b263d,0,.55,-2.7);box(6,3,.2,0x087eaa,0,3,-6.7);box(5.5,2.5,.08,0x061827,0,3,-6.55);
const people=[{name:'Raka',role:'CEO',job:'Memimpin strategi dan keputusan perusahaan.'},{name:'Maya',role:'Managing Director',job:'Mengatur arah dan koordinasi seluruh divisi.'},{name:'Dimas',role:'Studio Director',job:'Mengawasi produksi konten dan operasional studio.'},{name:'Nadia',role:'Operations',job:'Mengatur alur kerja dan administrasi operasional.'},{name:'Arif',role:'AI Video Producer',job:'Menyusun konsep dan produksi video berbasis AI.'},{name:'Sinta',role:'Video Producer',job:'Menyiapkan naskah, storyboard, dan produksi video.'},{name:'Bima',role:'Video Editor',job:'Mengedit video dan menyusun hasil akhir.'},{name:'Luna',role:'Motion Editor',job:'Membuat motion graphic dan animasi.'},{name:'Tara',role:'Growth Manager',job:'Mengembangkan strategi pertumbuhan YouTube.'},{name:'Fajar',role:'Marketing',job:'Mengelola pemasaran dan promosi konten.'}];
const colors=[0x27d7ff,0x398cff,0x9b69ff,0x29c89b,0xffb347],clickable=[],animated=[];function makeText(text,x,y,z){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#061827';ctx.fillRect(0,0,512,128);ctx.fillStyle='#65ddff';ctx.font='bold 35px Arial';ctx.textAlign='center';ctx.fillText(text,256,78);const texture=new THREE.CanvasTexture(c);const plane=new THREE.Mesh(new THREE.PlaneGeometry(2.6,.65),new THREE.MeshBasicMaterial({map:texture,transparent:true,side:THREE.DoubleSide}));plane.position.set(x,y,z);scene.add(plane)}people.forEach((p,i)=>{const x=-6.5+(i%5)*3.25,z=i<5?1.5:4.5;box(1.8,.2,1,0x247a9e,x,.65,z);box(.12,.65,.12,0x9bbacb,x-.7,.3,z);box(.12,.65,.12,0x9bbacb,x+.7,.3,z);box(.45,.8,.45,colors[i%5],x,1.25,z-.9);const head=new THREE.Mesh(new THREE.SphereGeometry(.38,20,20),new THREE.MeshStandardMaterial({color:0xffc99b}));head.position.set(x,2,z-.9);head.userData.personIndex=i;scene.add(head);clickable.push(head);animated.push(head);makeText(p.name+' - '+p.role,x,2.8,z-.9)});for(let x=-7;x<=7;x+=3.5){const lamp=new THREE.PointLight(0x32bfff,15,8);lamp.position.set(x,4.3,0);scene.add(lamp)}
const statusList=['PENDING','IN PROGRESS','REVIEW','DONE'];const taskKey='fts23_tasks',msgKey='fts23_messages';let tasks=[],messages=[];try{const saved=localStorage.getItem(taskKey);if(saved!==null)tasks=JSON.parse(saved);else{tasks=JSON.parse(localStorage.getItem('fts22_tasks')||'[]').map(t=>({...t,history:[{status:t.status||'PENDING',at:t.created||new Date().toLocaleString('id-ID'),note:'Diimpor dari FTS 2.2'}],createdBy:'CEO Raka'}));localStorage.setItem(taskKey,JSON.stringify(tasks))}}catch(e){tasks=[]}try{messages=JSON.parse(localStorage.getItem(msgKey)||'[]')}catch(e){messages=[]}
function persist(){localStorage.setItem(taskKey,JSON.stringify(tasks));updateCount()}function persistMessages(){localStorage.setItem(msgKey,JSON.stringify(messages))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showPanel(html){document.getElementById('panelContent').innerHTML=html;document.getElementById('panel').style.display='block'}window.closePanel=()=>document.getElementById('panel').style.display='none';function updateCount(){document.getElementById('taskCount').textContent=tasks.length+' TASKS'}updateCount();function logTask(t,note){if(!t.history)t.history=[];t.history.push({status:t.status,at:new Date().toLocaleString('id-ID'),note})}
window.openProfile=i=>{const p=people[i],mine=tasks.filter(t=>t.person===i);showPanel(`<h3>PROFIL ANGGOTA FTS</h3><h2>${p.name}</h2><p><b>Jabatan:</b> ${p.role}</p><p><b>Tanggung jawab:</b> ${p.job}</p><p><b>Jumlah tugas:</b> ${mine.length}</p><p><b>Selesai:</b> ${mine.filter(t=>t.status==='DONE').length}</p>${i===0?'<p class="muted">Raka adalah CEO dan pemegang keputusan tertinggi.</p>':`<button onclick="assignTo(${i})">BERIKAN TUGAS</button>`}<h4>Riwayat pekerjaan</h4>${renderEmployeeHistory(i)}`)};function renderEmployeeHistory(i){const mine=tasks.filter(t=>t.person===i);return mine.length?mine.slice().reverse().map(t=>`<div class="task"><b>${esc(t.description)}</b><br><span class="pill">${esc(t.status)}</span><br><span class="muted">Dibuat: ${esc(t.created||'-')}</span></div>`).join(''):'<p class="muted">Belum ada riwayat tugas.</p>'}
window.assignTo=i=>{showPanel(`<h3>BERIKAN TUGAS</h3><p>Anggota: <b>${people[i].name}</b></p><label>Instruksi CEO</label><textarea id="taskInput" placeholder="Tuliskan tugas dengan jelas..."></textarea><button onclick="saveTask(${i},'CEO Raka')">KIRIM TUGAS</button>`)};
window.openCommand=()=>{showPanel(`<h3>CEO COMMAND CENTER</h3><p>Selamat datang, CEO Raka. Pantau kinerja dan operasional FTS.</p><div class="tabs"><button class="active" onclick="showTab('dashboard')">DASHBOARD</button><button onclick="showTab('tasks')">TUGAS</button><button onclick="showTab('maya')">MAYA / DELEGASI</button><button onclick="showTab('messages')">KOMUNIKASI</button><button onclick="showTab('report')">LAPORAN</button><button onclick="showTab('ai')">AI</button></div><div id="tabContent">${dashboardHtml()}</div>`)};
window.showTab=tab=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().startsWith(tab==='dashboard'?'dashboard':tab==='tasks'?'tugas':tab==='maya'?'maya':tab==='messages'?'komunikasi':tab==='report'?'laporan':'ai')));const el=document.getElementById('tabContent');if(!el)return;el.innerHTML=tab==='dashboard'?dashboardHtml():tab==='tasks'?tasksHtml():tab==='maya'?mayaHtml():tab==='messages'?messagesHtml():tab==='report'?reportHtml():aiHtml()};
function dashboardHtml(){return `<h4>Ringkasan perusahaan</h4><div class="statgrid">${statusList.map(s=>`<div class="stat"><b>${tasks.filter(t=>t.status===s).length}</b><span>${s}</span></div>`).join('')}<div class="stat"><b>${people.length-1}</b><span>ANGGOTA TIM</span></div><div class="stat"><b>${messages.length}</b><span>PESAN INTERNAL</span></div></div><h4>Kinerja karyawan</h4>${people.slice(1).map((p,i)=>{const n=tasks.filter(t=>t.person===i+1);return `<div class="employee"><b>${p.name}</b> — ${p.role}<br><span class="muted">${n.length} tugas · ${n.filter(t=>t.status==='DONE').length} selesai · ${n.filter(t=>t.status==='IN PROGRESS').length} berjalan</span></div>`}).join('')}`}
function tasksHtml(){return `<h4>Daftar dan riwayat tugas</h4><button onclick="showPanel(document.getElementById('panelContent').innerHTML);openCommand()">REFRESH</button>${renderTasks()}`}
function mayaHtml(){return `<h4>Delegasi oleh Maya — Managing Director</h4><p class="muted">Simulasi alur koordinasi: Maya dapat meneruskan instruksi kepada anggota tim. Penugasan tetap tercatat atas nama Maya.</p><label>Pilih anggota penerima</label><select id="mayaAssignee">${people.map((p,i)=>i===0?'':`<option value="${i}">${p.name} — ${p.role}</option>`).join('')}</select><label>Instruksi dari Maya</label><textarea id="mayaTask" placeholder="Tuliskan tugas yang didelegasikan Maya..."></textarea><button onclick="mayaDelegate()">MAYA DELEGASIKAN TUGAS</button><h4>Tugas yang didelegasikan Maya</h4>${tasks.filter(t=>t.createdBy==='Maya').map(t=>`<div class="task"><b>${people[t.person]?.name||'Anggota'}</b><br>${esc(t.description)}<br><span class="pill">${esc(t.status)}</span></div>`).join('')||'<p class="muted">Belum ada delegasi dari Maya.</p>'}`}
window.mayaDelegate=()=>{const i=Number(document.getElementById('mayaAssignee').value),v=document.getElementById('mayaTask').value.trim();if(!v){alert('Isi instruksi delegasi Maya.');return}addTask(i,v,'Maya');showTab('maya')};
function messagesHtml(){return `<h4>Komunikasi internal FTS</h4><label>Pengirim</label><select id="msgSender">${people.map(p=>`<option>${p.name}</option>`).join('')}</select><label>Pesan</label><textarea id="msgText" placeholder="Tulis pesan atau koordinasi tim..."></textarea><button onclick="sendMessage()">KIRIM PESAN</button><h4>Papan komunikasi</h4>${messages.slice().reverse().map(m=>`<div class="message"><b>${esc(m.sender)}</b> <span class="muted">· ${esc(m.at)}</span><p>${esc(m.text)}</p></div>`).join('')||'<p class="muted">Belum ada pesan.</p>'}`}
window.sendMessage=()=>{const sender=document.getElementById('msgSender').value,text=document.getElementById('msgText').value.trim();if(!text){alert('Tulis pesan terlebih dahulu.');return}messages.push({sender,text,at:new Date().toLocaleString('id-ID')});persistMessages();showTab('messages')};
function reportHtml(){const today=new Date().toLocaleDateString('id-ID');const todayTasks=tasks.filter(t=>(t.history||[]).some(h=>String(h.at).includes(today))||String(t.created||'').includes(today));return `<h4>Laporan aktivitas harian</h4><p class="muted">Tanggal laporan: ${today}</p><div class="statgrid"><div class="stat"><b>${todayTasks.length}</b><span>TUGAS AKTIF / DIPERBARUI HARI INI</span></div><div class="stat"><b>${todayTasks.filter(t=>t.status==='DONE').length}</b><span>TUGAS SELESAI HARI INI</span></div><div class="stat"><b>${todayTasks.filter(t=>t.status==='REVIEW').length}</b><span>MENUNGGU REVIEW</span></div><div class="stat"><b>${messages.filter(m=>String(m.at).includes(today)).length}</b><span>PESAN HARI INI</span></div></div><h4>Rincian</h4>${todayTasks.map(t=>`<div class="task"><b>${people[t.person]?.name||'Anggota'}</b> — ${esc(t.status)}<br>${esc(t.description)}</div>`).join('')||'<p class="muted">Belum ada aktivitas tugas yang tercatat hari ini.</p>'}<button onclick="copyReport()">SALIN LAPORAN</button>`}
window.copyReport=()=>{const today=new Date().toLocaleDateString('id-ID');const lines=[`LAPORAN HARIAN FTS — ${today}`,...statusList.map(s=>`${s}: ${tasks.filter(t=>t.status===s).length}`),...tasks.map(t=>`${people[t.person]?.name}: ${t.status} — ${t.description}`)];navigator.clipboard?.writeText(lines.join('\n')).then(()=>alert('Laporan disalin.')).catch(()=>alert(lines.join('\n')))};
function aiHtml(){return `<h4>Integrasi AI FTS</h4><div class="notice"><b>Belum terhubung ke mesin AI.</b><br>Versi 2.3 ini menyediakan dashboard, delegasi, riwayat, komunikasi, dan laporan lokal. Agar karyawan dapat benar-benar menjalankan instruksi dengan AI, FTS membutuhkan backend aman dan koneksi API. Kunci API tidak boleh ditanam di file HTML publik.</div><h4>Rencana koneksi AI</h4><ol><li>Menyiapkan backend/server yang aman.</li><li>Menyimpan kunci API di server, bukan di browser.</li><li>Menghubungkan instruksi tugas ke model AI.</li><li>Menyimpan hasil AI ke laporan tugas untuk diperiksa CEO.</li></ol><p class="muted">Tidak ada pekerjaan AI yang diklaim berjalan pada versi ini.</p>`}
function renderTasks(){if(!tasks.length)return '<p>Belum ada tugas. CEO dapat memberikan instruksi pertama.</p>';return tasks.slice().map((t)=>{const i=tasks.indexOf(t);return `<div class="task"><b>${esc(people[t.person]?.name||'Anggota tim')}</b> <span class="muted">· Oleh ${esc(t.createdBy||'CEO Raka')}</span><br><span class="pill">${esc(t.status)}</span><br>${esc(t.description)}<br><span class="muted">Dibuat: ${esc(t.created||'-')}</span>${t.result?`<p><b>Hasil/laporan:</b><br>${esc(t.result)}</p>`:''}<div class="actions">${t.status==='PENDING'?`<button onclick="setStatus(${i},'IN PROGRESS')">MULAI TUGAS</button>`:''}${t.status==='IN PROGRESS'?`<button onclick="submitReview(${i})">KIRIM UNTUK REVIEW</button>`:''}${t.status==='REVIEW'?`<button class="good" onclick="approveTask(${i})">APPROVE / DONE</button><button class="danger" onclick="returnTask(${i})">MINTA REVISI</button>`:''}${t.status!=='DONE'?`<button onclick="editTask(${i})">UBAH TUGAS</button>`:''}<button onclick="historyTask(${i})">RIWAYAT</button></div></div>`}).join('')}
function addTask(i,value,by){const t={id:Date.now()+Math.random(),person:i,description:value,status:'PENDING',result:'',created:new Date().toLocaleString('id-ID'),createdBy:by,history:[]};tasks.push(t);logTask(t,'Tugas dibuat');persist()}
window.saveCommand=()=>{const selected=document.getElementById('assignee').value;if(selected===''){alert('Pilih anggota tim terlebih dahulu.');return}saveTask(Number(selected),'CEO Raka')};window.saveTask=(i,by='CEO Raka')=>{const input=document.getElementById('taskInput'),value=input.value.trim();if(!value){alert('Tuliskan instruksi terlebih dahulu.');return}addTask(i,value,by);openCommand()};window.setStatus=(i,status)=>{tasks[i].status=status;logTask(tasks[i],'Status diubah menjadi '+status);persist();openCommand()};window.submitReview=i=>{showPanel(`<h3>KIRIM HASIL UNTUK REVIEW</h3><p>Tugas: ${esc(tasks[i].description)}</p><label>Catatan atau hasil pekerjaan</label><textarea id="resultInput" placeholder="Tuliskan hasil pekerjaan atau laporan untuk CEO..."></textarea><button onclick="saveReview(${i})">KIRIM KE CEO</button>`)};window.saveReview=i=>{const v=document.getElementById('resultInput').value.trim();if(!v){alert('Isi laporan singkat sebelum mengirim review.');return}tasks[i].result=v;tasks[i].status='REVIEW';logTask(tasks[i],'Hasil dikirim untuk review');persist();openCommand()};window.approveTask=i=>{if(!confirm('CEO menyetujui hasil tugas ini dan menandainya DONE?'))return;tasks[i].status='DONE';logTask(tasks[i],'Disetujui CEO Raka');persist();openCommand()};window.returnTask=i=>{tasks[i].status='IN PROGRESS';logTask(tasks[i],'Dikembalikan untuk revisi oleh CEO');persist();openCommand()};window.editTask=i=>{showPanel(`<h3>UBAH TUGAS</h3><label>Instruksi pekerjaan</label><textarea id="editInput">${esc(tasks[i].description)}</textarea><button onclick="saveEdit(${i})">SIMPAN PERUBAHAN</button>`)};window.saveEdit=i=>{const v=document.getElementById('editInput').value.trim();if(!v){alert('Instruksi tidak boleh kosong.');return}tasks[i].description=v;logTask(tasks[i],'Instruksi diperbarui');persist();openCommand()};window.historyTask=i=>{const t=tasks[i];showPanel(`<h3>RIWAYAT TUGAS</h3><p><b>${esc(t.description)}</b></p>${(t.history||[]).map(h=>`<div class="task"><span class="pill">${esc(h.status)}</span><br>${esc(h.note)}<br><span class="muted">${esc(h.at)}</span></div>`).join('')||'<p>Belum ada riwayat.</p>'}`)};
window.home=()=>{camera.position.set(13,12,18);controls.target.set(0,1,0);controls.update()};window.move=(x,z)=>{camera.position.set(x+8,9,z+12);controls.target.set(x*.35,1,z*.35);controls.update()};const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',event=>{if(document.getElementById('panel').style.display==='block')return;const r=renderer.domElement.getBoundingClientRect();pointer.x=((event.clientX-r.left)/r.width)*2-1;pointer.y=-((event.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(clickable);if(hits.length)window.openProfile(hits[0].object.userData.personIndex)});function animate(){requestAnimationFrame(animate);const t=performance.now()*.001;animated.forEach((a,i)=>a.position.y=2+Math.sin(t*1.5+i)*.035);controls.update();renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
