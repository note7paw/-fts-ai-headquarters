
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FTS AI Headquarters 2.0</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#07111f;color:white;font-family:Arial,sans-serif}
#top{position:absolute;top:12px;left:12px;z-index:5;background:#10243bdc;padding:12px 16px;border:1px solid #2c80ad;border-radius:12px}
#top h2{margin:0 0 5px;color:#55d9ff;font-size:18px}
#top small{color:#b9d8e8}
#controls{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:95%}
button{background:#123b59;color:white;border:1px solid #42c9f5;border-radius:9px;padding:10px 14px;font-weight:bold}
button:active{background:#087ca5}
#info{position:absolute;right:12px;top:12px;z-index:5;background:#10243bdc;padding:12px;border-radius:10px;border:1px solid #28648a;font-size:12px;max-width:150px}
</style>
</head>
<body>

<div id="top">
<h2>FTS AI HEADQUARTERS</h2>
<small>Forex Trading Studio • Version 2.0</small>
</div>

<div id="info">10 AI TEAM MEMBERS<br>Virtual Office System</div>

<div id="controls">
<button onclick="moveCamera(0,0)">HOME</button>
<button onclick="moveCamera(-7,0)">LEFT</button>
<button onclick="moveCamera(7,0)">RIGHT</button>
<button onclick="moveCamera(0,7)">FRONT</button>
<button onclick="moveCamera(0,-7)">BACK</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07111f);

const camera = new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,1000);
camera.position.set(13,12,18);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.target.set(0,1,0);
controls.maxPolarAngle = Math.PI/2.05;
controls.minDistance = 7;
controls.maxDistance = 35;

scene.add(new THREE.HemisphereLight(0x9edcff,0x18243b,2));

const light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(8,15,10);
scene.add(light);

function box(w,h,d,color,x,y,z){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color,roughness:.55})
 );
 mesh.position.set(x,y,z);
 scene.add(mesh);
 return mesh;
}

// Lantai kantor
box(18,.4,14,0x172b40,0,-.2,0);

// Karpet tengah
box(12,.08,9,0x203d55,0,.05,0);

// Dinding belakang dan samping
box(18,5,.3,0x102c45,0,2.5,-7);
box(.3,5,14,0x102c45,-9,2.5,0);
box(.3,5,14,0x102c45,9,2.5,0);

// Panel kaca depan
box(18,4,.12,0x17617b,0,2.5,7);

// Meja CEO
box(3,.25,1.4,0x38a9cf,0,1, -4);
box(.15,1,.15,0x9bbacb,-1.3,.5,-4);
box(.15,1,.15,0x9bbacb,1.3,.5,-4);

// Kursi CEO
box(1,.9,.8,0x1b263d,0,.55,-2.7);

// Meja tim
const names=[
 'RAKA - CEO','MAYA - DIRECTOR','DIMAS - STUDIO',
 'NADIA - OPERATIONS','ARIF - AI PRODUCER',
 'SINTA - PRODUCER','BIMA - EDITOR',
 'LUNA - MOTION','TARA - GROWTH','FAJAR - MARKETING'
];

const colors=[0x27d7ff,0x398cff,0x9b69ff,0x29c89b,0xffb347];

function makeText(text,x,y,z){
 const canvas=document.createElement('canvas');
 canvas.width=512;canvas.height=128;
 const ctx=canvas.getContext('2d');
 ctx.fillStyle='#061827';
 ctx.fillRect(0,0,512,128);
 ctx.fillStyle='#65ddff';
 ctx.font='bold 35px Arial';
 ctx.textAlign='center';
 ctx.fillText(text,256,78);
 const texture=new THREE.CanvasTexture(canvas);
 const material=new THREE.MeshBasicMaterial({map:texture,transparent:true,side:THREE.DoubleSide});
 const plane=new THREE.Mesh(new THREE.PlaneGeometry(2.6,.65),material);
 plane.position.set(x,y,z);
 scene.add(plane);
}

for(let i=0;i<10;i++){
 const x=-6.5+(i%5)*3.25;
 const z=i<5?1.5:4.5;
 box(1.8,.2,1,0x247a9e,x,.65,z);
 box(.12,.65,.12,0x9bbacb,x-.7,.3,z);
 box(.12,.65,.12,0x9bbacb,x+.7,.3,z);
 box(.45,.8,.45,colors[i%5],x,1.25,z-.9);
 box(.65,.65,.65,0xffc99b,x,2,z-.9);
 makeText(names[i],x,2.8,z-.9);
}

// Layar presentasi
box(6,3,.2,0x087eaa,0,3,-6.7);
box(5.5,2.5,.08,0x061827,0,3,-6.55);

// Lampu dekorasi
for(let x=-7;x<=7;x+=3.5){
 const lamp=new THREE.PointLight(0x32bfff,15,8);
 lamp.position.set(x,4.3,0);
 scene.add(lamp);
}

window.moveCamera=function(x,z){
 camera.position.set(x+8,9,z+12);
 controls.target.set(x*.35,1,z*.35);
 controls.update();
};

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
